default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-check
        args: ["--no-fix"]
      - id: ruff-format
        args: ["--check"]
  - repo: local
    hooks:
      - id: commit-msg-format
        name: commit message format
        language: python
        entry: python scripts/check_commit_msg.py
        stages: [commit-msg]

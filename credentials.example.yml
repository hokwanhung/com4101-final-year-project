# Copy this file to credentials.yml and fill in local values.
# credentials.yml is gitignored and must never be committed.

rest:

telegram:
  access_token: "YOUR_TELEGRAM_BOT_TOKEN"
  verify: "YOUR_BOT_USERNAME"
  webhook_url: "https://YOUR_HOST/webhooks/telegram/webhook"

socketio:
  user_message_evt: user_uttered
  bot_message_evt: bot_uttered
  session_persistence: true

rasa:
  url: "http://localhost:5002/api"
